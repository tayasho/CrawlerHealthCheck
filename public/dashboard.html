      const stop = parseInt(r[colMap.stopDays]);
      if (isNaN(stop)) return;
      const orgName = r[nameCol] || '';
      const abbr = r[abbrCol] || '';
      const jp = r[jpCol] || '';
      const id = crawlerIdCol ? (r[crawlerIdCol] || '').trim() : '';
      const url = r[urlCol] || '';
      const target = r[targetCol] || '';
      const fields = [country, orgName, abbr, jp, id, url, target];
      if (!fields.some(f => f.toLowerCase().includes(q))) return;
      const displayName = orgLang === 'ja' && jp ? jp : (orgName || abbr);
      let lastCrawled = lastCrawledColH ? (r[lastCrawledColH] || '').trim() : '';
      if (lastCrawled) {
        const d = new Date(lastCrawled);
        if (!isNaN(d.getTime())) lastCrawled = d.toISOString().slice(0, 10);
      }
      const prio = colMap.priority ? (r[colMap.priority] || '').trim() : '';
      const status = colMap.status ? (r[colMap.status] || '').trim() : '';
      results.push({ country, displayName, orgName, id, stop, lastCrawled, prio, status, url, target });
    });

    if (results.length === 0) {
      panel.style.display = 'none';
      return;
    }

    results.sort((a, b) => b.stop - a.stop);

    let html = `<div class="search-results-panel">`;
    html += `<h3>🔍 Search Results <span class="sr-count">${results.length} crawlers</span></h3>`;
    html += `<table><thead><tr>
      <th>#</th>
      <th>Organization</th>
      <th>Country</th>
      <th>Status</th>
      <th>Stop Days</th>
      <th>Last Crawled</th>
      <th>Crawler ID</th>
    </tr></thead><tbody>`;
    results.forEach((it, i) => {
      const isActive = it.stop <= 0;
      const statusLabel = isActive ? 'Active' : 'Stopped';
      const statusCls = isActive ? 'active' : 'stopped';
      html += `<tr>
        <td>${i + 1}</td>
        <td><span class="sr-org" data-name="${(it.orgName || it.displayName).replace(/"/g,'&quot;')}" data-id="${it.id}" data-country="${it.country}" data-stop="${it.stop}" data-last="${it.lastCrawled}" data-url="${it.url}" data-target="${it.target}" data-prio="${it.prio}">${it.displayName}</span></td>
        <td>${it.country}</td>
        <td><span class="sr-status ${statusCls}">${statusLabel}</span></td>
        <td>${it.stop > 0 ? it.stop + ' days' : '—'}</td>
        <td>${it.lastCrawled || '—'}</td>
        <td style="font-family:var(--mono);font-size:12px">${it.id || '—'}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    panel.innerHTML = html;
    panel.style.display = 'block';

    panel.querySelectorAll('.sr-org').forEach(el => {
      el.addEventListener('click', () => {
        showCrawlerPopup(el.dataset);
      });
    });
  }

  function render() {
    // preserve search focus across DOM rebuild
    const prevFocused = document.activeElement && document.activeElement.id === 'searchInput';
    const entries = compute();
    const totalActive = entries.reduce((s, e) => s + e.active, 0);
    const totalStopped = entries.reduce((s, e) => s + e.stopped, 0);
    const totalAll = totalActive + totalStopped;
    const overallPct = totalAll ? Math.round(totalActive / totalAll * 100) : 0;

    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="label">Countries</div><div class="value">${entries.length}</div></div>
      <div class="stat-card"><div class="label">Crawlers</div><div class="value">${totalAll.toLocaleString()}</div></div>
      <div class="stat-card"><div class="label">Active</div><div class="value green">${totalActive.toLocaleString()}</div></div>
      <div class="stat-card"><div class="label">Stopped</div><div class="value red">${totalStopped.toLocaleString()}</div></div>
      <div class="stat-card"><div class="label">Active rate</div><div class="value ${overallPct >= 70 ? 'green' : overallPct >= 50 ? 'amber' : 'red'}">${overallPct}%</div></div>
    `;

    let ctrlHTML = `
      <span class="group-label">View:</span>
      <div class="pill-group">
        <button class="pill view-toggle ${viewMode==='tiles'?'active':''}" data-view="tiles">Tiles</button>
        <button class="pill view-toggle ${viewMode==='cartogram'?'active':''}" data-view="cartogram">Map</button>
      </div>
      <div class="separator"></div>
      <span class="group-label">Sort:</span>
      <div class="pill-group">
        <button class="pill ${sortBy==='total'?'active':''}" data-sort="total" ${viewMode==='cartogram'?'disabled style="opacity:.3;pointer-events:none"':''}>Total</button>
        <button class="pill ${sortBy==='pct'?'active':''}" data-sort="pct" ${viewMode==='cartogram'?'disabled style="opacity:.3;pointer-events:none"':''}>Stopped %</button>
        <button class="pill ${sortBy==='alpha'?'active':''}" data-sort="alpha" ${viewMode==='cartogram'?'disabled style="opacity:.3;pointer-events:none"':''}>A → Z</button>
      </div>
    `;
    if (orgTypes.size > 0) {
      ctrlHTML += `
        <div class="separator"></div>
        <span class="group-label">Org type:</span>
        <div class="pill-group org-filter-section">
          <button class="pill org-all ${activeOrgTypes.size === orgTypes.size ? 'active' : ''}">All</button>
          ${[...orgTypes].sort().map(t =>
            `<button class="pill org-toggle ${activeOrgTypes.has(t)?'active':''}" data-org="${t}">${t}</button>`
          ).join('')}
        </div>
      `;
    }
    if (statusTypes.size > 0) {
      ctrlHTML += `
        <div class="separator"></div>
        <span class="group-label">Status:</span>
        <div class="pill-group">
          <button class="pill status-all ${activeStatusTypes.size === statusTypes.size ? 'active' : ''}">All</button>
          ${[...statusTypes].sort().map(t =>
            `<button class="pill status-toggle ${activeStatusTypes.has(t)?'active':''}" data-status="${t}">${t}</button>`
          ).join('')}
        </div>
      `;
    }
    if (octoAccounts.size > 0) {
      ctrlHTML += `
        <div class="separator"></div>
        <span class="group-label">Account:</span>
        <div class="pill-group">
          <button class="pill octo-all ${activeOctoAccounts.size === octoAccounts.size ? 'active' : ''}">All</button>
          ${[...octoAccounts].sort().map(t =>
            `<button class="pill octo-toggle ${activeOctoAccounts.has(t)?'active':''}" data-octo="${t}">${t}</button>`
          ).join('')}
        </div>
      `;
    }
    if (priorityTypes.size > 0) {
      ctrlHTML += `
        <div class="separator"></div>
        <span class="group-label">Priority:</span>
        <div class="pill-group">
          <button class="pill prio-all ${activePriorityTypes.size === priorityTypes.size ? 'active' : ''}">All</button>
          ${[...priorityTypes].sort().map(t =>
            `<button class="pill prio-toggle ${activePriorityTypes.has(t)?'active':''}" data-prio="${t}">${t}</button>`
          ).join('')}
        </div>
      `;
    }
    ctrlHTML += `
      <div class="separator"></div>
      <span class="group-label">Org Name:</span>
      <div class="pill-group">
        <button class="pill lang-toggle ${orgLang==='en'?'active':''}" data-lang="en">EN</button>
        <button class="pill lang-toggle ${orgLang==='ja'?'active':''}" data-lang="ja">JP</button>
      </div>
    `;
    ctrlHTML += `
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by country / crawler / ID / URL..." value="${searchQuery}">
      </div>
    `;
    document.getElementById('controls').innerHTML = ctrlHTML;

    document.querySelectorAll('.view-toggle').forEach(btn => {
      btn.addEventListener('click', () => { viewMode = btn.dataset.view; render(); });
    });
    document.querySelectorAll('[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => { sortBy = btn.dataset.sort; render(); });
    });
    document.querySelectorAll('.org-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.org;
        if (activeOrgTypes.has(t)) activeOrgTypes.delete(t);
        else activeOrgTypes.add(t);
        render();
      });
    });
    const allBtn = document.querySelector('.org-all');
    if (allBtn) {
      allBtn.addEventListener('click', () => {
        if (activeOrgTypes.size === orgTypes.size) activeOrgTypes = new Set();
        else activeOrgTypes = new Set(orgTypes);
        render();
      });
    }
    document.querySelectorAll('.status-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.status;
        if (activeStatusTypes.has(t)) activeStatusTypes.delete(t);
        else activeStatusTypes.add(t);
        render();
      });
    });
    const statusAllBtn = document.querySelector('.status-all');
    if (statusAllBtn) {
      statusAllBtn.addEventListener('click', () => {
        if (activeStatusTypes.size === statusTypes.size) activeStatusTypes = new Set();
        else activeStatusTypes = new Set(statusTypes);
        render();
      });
    }
    document.querySelectorAll('.octo-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.octo;
        if (activeOctoAccounts.has(t)) activeOctoAccounts.delete(t);
        else activeOctoAccounts.add(t);
        render();
      });
    });
    const octoAllBtn = document.querySelector('.octo-all');
    if (octoAllBtn) {
      octoAllBtn.addEventListener('click', () => {
        if (activeOctoAccounts.size === octoAccounts.size) activeOctoAccounts = new Set();
        else activeOctoAccounts = new Set(octoAccounts);
        render();
      });
    }
    document.querySelectorAll('.prio-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.prio;
        if (activePriorityTypes.has(t)) activePriorityTypes.delete(t);
        else activePriorityTypes.add(t);
        render();
      });
    });
    const prioAllBtn = document.querySelector('.prio-all');
    if (prioAllBtn) {
      prioAllBtn.addEventListener('click', () => {
        if (activePriorityTypes.size === priorityTypes.size) activePriorityTypes = new Set();
        else activePriorityTypes = new Set(priorityTypes);
        render();
      });
    }
    document.querySelectorAll('.lang-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        orgLang = btn.dataset.lang;
        render();
      });
    });
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', e => { searchQuery = e.target.value; render(); });
    if (prevFocused) {
      searchInput.focus();
      searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
    }

    const grid = document.getElementById('grid');
    if (viewMode === 'cartogram') {
      grid.classList.add('cartogram-mode');
    } else {
      grid.classList.remove('cartogram-mode');
    }
    if (entries.length === 0) {
      grid.innerHTML = '<div class="empty-state"><h3>No data to display</h3><p>Try adjusting your filters</p></div>';
      return;
    }

    if (viewMode === 'cartogram') {
      const mapped = [];
      const unmapped = [];
      entries.forEach(d => {
        const coord = TILE_COORDS[d.name];
        if (coord) mapped.push({...d, col: coord[0], row: coord[1]});
        else unmapped.push(d);
      });
      let html = mapped.map(d => {
        const c = getColorForPct(d.pct);
        const activePct = 100 - d.pct;
        return `<div class="cell" style="background:${c.bg};color:${c.text};cursor:pointer;--gc:${d.col};--gr:${d.row}" data-country="${d.name.replace(/"/g,'&quot;')}">
          <span class="name">${d.name}</span>
          <span class="num">${d.active}/${d.total}</span>
          <div class="tooltip">
            <div class="tt-name">${d.name}</div>
            <div class="tt-row"><span class="tt-label">Active</span><span class="tt-val g">${d.active} (${activePct}%)</span></div>
            <div class="tt-row"><span class="tt-label">Stopped</span><span class="tt-val r">${d.stopped} (${d.pct}%)</span></div>
            <div class="tt-row"><span class="tt-label">Total</span><span class="tt-val">${d.total}</span></div>
          </div>
        </div>`;
      }).join('');
      if (unmapped.length) {
        html += unmapped.map(d => {
          const c = getColorForPct(d.pct);
          const activePct = 100 - d.pct;
          return `<div class="cell" style="background:${c.bg};color:${c.text};cursor:pointer;--gc:auto;--gr:21" data-country="${d.name.replace(/"/g,'&quot;')}">
            <span class="name">${d.name}</span>
            <span class="num">${d.active}/${d.total}</span>
            <div class="tooltip">
              <div class="tt-name">${d.name}</div>
              <div class="tt-row"><span class="tt-label">Active</span><span class="tt-val g">${d.active} (${activePct}%)</span></div>
              <div class="tt-row"><span class="tt-label">Stopped</span><span class="tt-val r">${d.stopped} (${d.pct}%)</span></div>
              <div class="tt-row"><span class="tt-label">Total</span><span class="tt-val">${d.total}</span></div>
            </div>
          </div>`;
        }).join('');
      }
      // Add grey tiles for countries in TILE_COORDS but not in data
      const dataCountries = new Set(entries.map(e => e.name));
      Object.entries(TILE_COORDS).forEach(([name, coord]) => {
        if (dataCountries.has(name)) return;
        // Skip label-only entries
        if (['Oceania','Africa','Other(Africa)','Other(Asia)','Other(Europe)','Other(ASEAN)','Other(ASEM)','Multinational'].includes(name)) return;
        html += `<div class="cell cell-empty" style="--gc:${coord[0]};--gr:${coord[1]}" data-country="${name.replace(/"/g,'&quot;')}">
          <span class="name">${name}</span>
          <span class="num">—</span>
          <div class="tooltip">
            <div class="tt-name">${name}</div>
            <div class="tt-row"><span class="tt-label">No crawlers</span></div>
          </div>
        </div>`;
      });
      grid.innerHTML = html;
      // Draw region boundary outlines using CSS grid placement (responsive)
      Object.entries(REGION_BOUNDS).forEach(([label, def]) => {
        let minCol = Infinity, maxCol = 0, minRow = Infinity, maxRow = 0;
        let count = 0;
        def.countries.forEach(c => {
          const coord = TILE_COORDS[c];
          if (!coord) return;
          count++;
          if (coord[0] < minCol) minCol = coord[0];
          if (coord[0] > maxCol) maxCol = coord[0];
          if (coord[1] < minRow) minRow = coord[1];
          if (coord[1] > maxRow) maxRow = coord[1];
        });
        if (!count) return;
        const outline = document.createElement('div');
        outline.className = 'region-outline';
        outline.style.gridColumn = minCol + ' / ' + (maxCol + 1);
        outline.style.gridRow = minRow + ' / ' + (maxRow + 1);
        outline.style.borderColor = def.color;
        outline.innerHTML = '<span class="region-label" style="color:' + def.color + '">' + label + '</span>';
        grid.appendChild(outline);
      });
    } else {
      grid.innerHTML = entries.map(d => {
        const c = getColorForPct(d.pct);
        const activePct = 100 - d.pct;
        return `<div class="cell" style="background:${c.bg};color:${c.text};cursor:pointer" data-country="${d.name.replace(/"/g,'&quot;')}">
          <span class="name">${d.name}</span>
          <span class="num">${d.active}/${d.total}</span>
          <div class="tooltip">
            <div class="tt-name">${d.name}</div>
            <div class="tt-row"><span class="tt-label">Active</span><span class="tt-val g">${d.active} (${activePct}%)</span></div>
            <div class="tt-row"><span class="tt-label">Stopped</span><span class="tt-val r">${d.stopped} (${d.pct}%)</span></div>
            <div class="tt-row"><span class="tt-label">Total</span><span class="tt-val">${d.total}</span></div>
          </div>
        </div>`;
      }).join('');
    }

    grid.querySelectorAll('.cell[data-country]').forEach(cell => {
      cell.addEventListener('click', () => showDetail(cell.dataset.country));
    });

    if (activeTab === 'action') renderActionPanel();
    if (activeTab === 'maint') renderMaintPanel();
    renderSearchResults();
  }

  function getFilteredRows(country) {
    return rawRows.filter(r => {
      if ((r[colMap.country] || '').trim() !== country) return false;
      if (colMap.orgType) {
        const ot = (r[colMap.orgType] || '').trim();
        if (ot && !activeOrgTypes.has(ot)) return false;
      }
      if (colMap.status) {
        const st = (r[colMap.status] || '').trim();
        if (st && !activeStatusTypes.has(st)) return false;
      }
      if (colMap.octoAccount) {
        const raw = (r[colMap.octoAccount] || '').trim();
        const accts = raw ? raw.split(';').map(a => a.trim()).filter(Boolean) : [];
        if (accts.length > 0 && !accts.some(a => activeOctoAccounts.has(a))) return false;
        if (accts.length === 0 && !activeOctoAccounts.has('(empty)')) return false;
      }
      if (colMap.priority) {
        const pr = (r[colMap.priority] || '').trim();
        const prKey = pr || '(empty)';
        if (!activePriorityTypes.has(prKey)) return false;
      }
      const stop = parseInt(r[colMap.stopDays]);
      if (isNaN(stop)) return false;
      return true;
    });
  }

  function showDetail(country) {
    const rows = getFilteredRows(country);
    if (!rows.length) return;

    const activeCount = rows.filter(r => parseInt(r[colMap.stopDays]) <= 0).length;
    const stoppedCount = rows.length - activeCount;

    const nameCol = headers.find(h => h.toLowerCase().includes('organization') && h.toLowerCase().includes('original')) || '';
    const abbrCol = headers.find(h => h.toLowerCase().includes('abbreviation')) || '';
    const jpCol = headers.find(h => h === '日本語名称') || '';
    const freqCol = headers.find(h => h.toLowerCase().includes('update') && h.toLowerCase().includes('freq')) || headers.find(h => h === 'Update Frequency(Day)') || '';
    const urlCol = headers.find(h => h.toLowerCase().includes('detail page url')) || '';
    const targetCol = headers.find(h => h.toLowerCase().includes('target url')) || '';
    const orgTypeCol = colMap.orgType;
    const statusCol = colMap.status;
    const octoCol = colMap.octoAccount;
    const prioCol = colMap.priority;
    const crawlerIdCol2 = headers.find(h => h.toLowerCase().includes('crawler id')) || '';
    const lastCrawledCol2 = headers.find(h => h.toLowerCase().includes('last crawled') || h.toLowerCase().includes('last_crawled')) || '';

    rows.sort((a, b) => parseInt(b[colMap.stopDays]) - parseInt(a[colMap.stopDays]));

    let tableHTML = '<table class="detail-table"><thead><tr>';
    tableHTML += '<th>Status</th>';
    tableHTML += '<th>Organization</th>';
    if (orgTypeCol) tableHTML += '<th>Type</th>';
    if (prioCol) tableHTML += '<th>Priority</th>';
    if (octoCol) tableHTML += '<th>Account</th>';
    tableHTML += '<th>Stop Days</th>';
    if (freqCol) tableHTML += '<th>Update Freq.</th>';
    if (statusCol) tableHTML += '<th>Publish</th>';
    tableHTML += '<th>Target</th>';
    tableHTML += '<th style="text-align:center">Log</th>';
    tableHTML += '</tr></thead><tbody>';

    rows.forEach(r => {
      const stop = parseInt(r[colMap.stopDays]);
      const isStopped = stop > 0;
      const badge = isStopped
        ? '<span class="badge badge-stopped">Stopped</span>'
        : '<span class="badge badge-active">Active</span>';

      const orgName = r[nameCol] || '';
      const abbr = r[abbrCol] || '';
      const jp = r[jpCol] || '';
      const detailUrl = r[urlCol] || '';
      const targetUrl = r[targetCol] || '';

      let displayName;
      let titleAttr;
      if (orgLang === 'ja') {
        displayName = jp || abbr || orgName || '—';
        titleAttr = orgName || abbr;
      } else {
        displayName = abbr && abbr !== orgName ? abbr + ' — ' + orgName : (orgName || abbr || jp || '—');
        titleAttr = jp || orgName;
      }
      const cid = crawlerIdCol2 ? (r[crawlerIdCol2] || '').trim() : '';
      let lastCr = lastCrawledCol2 ? (r[lastCrawledCol2] || '').trim() : '';
      if (lastCr) { const dd = new Date(lastCr); if (!isNaN(dd.getTime())) lastCr = dd.toISOString().slice(0, 10); }
      const pv2 = prioCol ? (r[prioCol] || '').trim() : '';

      const esc = s => (s || '').replace(/"/g, '&quot;');
      const nameCell = '<span class="detail-crawler-link" '
        + 'data-name="' + esc(orgName || displayName) + '" '
        + 'data-id="' + esc(cid) + '" '
        + 'data-country="' + esc(country) + '" '
        + 'data-stop="' + stop + '" '
        + 'data-last="' + esc(lastCr) + '" '
        + 'data-url="' + esc(detailUrl) + '" '
        + 'data-target="' + esc(targetUrl) + '" '
        + 'data-prio="' + esc(pv2) + '" '
        + 'title="Show crawler details" style="cursor:pointer;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:1px">'
        + displayName + '</span>';

      tableHTML += '<tr>';
      tableHTML += '<td>' + badge + '</td>';
      tableHTML += '<td class="org-name">' + nameCell + '</td>';
      if (orgTypeCol) tableHTML += '<td style="white-space:nowrap;color:var(--text-muted);font-size:12px;font-weight:600">' + (r[orgTypeCol] || '') + '</td>';
      if (prioCol) {
        const pv = (r[prioCol] || '').trim();
        const pc = pv === '最重要' ? 'var(--red)' : pv === '重要' ? '#D97706' : 'var(--text-muted)';
        tableHTML += '<td style="font-size:12px;white-space:nowrap;color:' + pc + ';font-weight:700">' + (pv || '—') + '</td>';
      }
      if (octoCol) tableHTML += '<td style="font-family:var(--mono);font-size:11px;color:var(--text-muted);white-space:nowrap;font-weight:500">' + (r[octoCol] || '—') + '</td>';
      tableHTML += '<td class="stop-days" style="color:' + (isStopped ? 'var(--red)' : '#16A34A') + '">' + stop + '</td>';
      if (freqCol) tableHTML += '<td style="font-family:var(--mono);font-size:12px;color:var(--text-muted);font-weight:500">' + (r[freqCol] || '') + 'd</td>';
      if (statusCol) tableHTML += '<td style="font-size:12px;color:var(--text-muted);font-weight:500">' + (r[statusCol] || '') + '</td>';
      tableHTML += '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        (targetUrl ? '<a href="' + targetUrl + '" target="_blank" rel="noopener" style="color:var(--blue);font-size:11px;font-weight:500;border-bottom:2px solid var(--blue)">' + targetUrl.replace(/^https?:\/\//, '').slice(0, 40) + '</a>' : '') +
        '</td>';
      tableHTML += '<td style="text-align:center"><button class="maint-btn secondary detail-maint-btn" '
        + 'data-name="' + esc(orgName || displayName) + '" '
        + 'data-id="' + esc(cid) + '" '
        + 'data-country="' + esc(country) + '" '
        + 'data-stop="' + stop + '" '
        + 'data-last="' + esc(lastCr) + '" '
        + 'data-url="' + esc(detailUrl) + '" '
        + 'data-target="' + esc(targetUrl) + '" '
        + 'data-prio="' + esc(pv2) + '" '
        + 'style="margin:0;padding:4px 10px;font-size:11px">📝</button></td>';
      tableHTML += '</tr>';
    });

    tableHTML += '</tbody></table>';

    const overlay = document.getElementById('detailOverlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div class="detail-panel">
        <div class="detail-header">
          <div>
            <h2>${country}</h2>
            <div class="detail-summary">
              <span style="color:#16A34A">${activeCount} active</span>
              <span style="color:var(--red)">${stoppedCount} stopped</span>
              <span style="color:var(--text-muted)">${rows.length} total</span>
            </div>
          </div>
          <button class="detail-close" id="detailClose">&times;</button>
        </div>
        ${tableHTML}
        <div class="maint-history" id="detailMaintHistory" style="margin-top:20px"></div>
      </div>
    `;

    document.getElementById('detailClose').addEventListener('click', closeDetail);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });
    document.addEventListener('keydown', escHandler);

    // Crawler detail popups from country detail rows
    overlay.querySelectorAll('.detail-crawler-link').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        showCrawlerPopup(el.dataset);
      });
    });

    // Maintenance record buttons per crawler row
    overlay.querySelectorAll('.detail-maint-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        showMaintenanceForm(btn.dataset, () => loadCountryHistory(country, overlay));
      });
    });

    // Load maintenance history for all crawlers in this country
    loadCountryHistory(country, overlay);
  }

  function escHandler(e) { if (e.key === 'Escape') closeDetail(); }

  function closeDetail() {
    document.getElementById('detailOverlay').style.display = 'none';
    document.removeEventListener('keydown', escHandler);
  }

  // --- Maintenance record system (API-based) ---
  let dbReady = true; // Always ready when logged in via Next.js auth
  let userId = null;
  let userName = null;

  // Fetch current user info from NextAuth session
  (async () => {
    try {
      const res = await fetch('/api/auth/session');
      const session = await res.json();
      if (session && session.user) {
        userId = session.user.id || session.user.email;
        userName = session.user.name || '';
        // Add user nav to header
        const header = document.querySelector('header');
        if (header) {
          const nav = document.createElement('div');
          nav.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:10px';
          nav.innerHTML = '<span style="font-size:13px;font-weight:600">👤 ' + (userName||'').replace(/</g,'&lt;') + '</span>'
            + '<button onclick="fetch(\'/api/auth/signout\',{method:\'POST\'}).then(()=>location.href=\'/login\')" '
            + 'style="padding:4px 12px;background:#fee2e2;border:2px solid #1a1a1a;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">Logout</button>';
          header.appendChild(nav);
        }
      }
    } catch(e) { console.log('Session check error:', e); }
  })();

  // API helpers
  async function apiGet(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error: ' + res.status);
    return res.json();
  }
  async function apiPost(url, data) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error('API error: ' + res.status);
    return res.json();
  }
  async function apiPut(url, data) {
    const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error('API error: ' + res.status);
    return res.json();
  }
  async function apiDelete(url) {
    const res = await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error('API error: ' + res.status);
    return res.json();
  }

  // Display labels for internal Japanese values (kept for DB backward compatibility)
  const actionLabels = {'再起動':'Restart','設定変更':'Config Change','URL更新':'URL Update','エラー調査':'Error Investigation','新規作成':'New Creation','自動検知':'Auto-detected','その他':'Other'};
  const resultLabels = {'復旧':'Resolved','未解決':'Unresolved','経過観察':'Monitoring','ローカル実行':'Local Only','廃止':'Retired'};

  function showMaintenanceForm(crawlerData, onSaved) {
    const existing = document.querySelector('.maint-form-overlay');
    if (existing) existing.remove();

    const today = new Date().toISOString().slice(0, 10);
    const overlay = document.createElement('div');
    overlay.className = 'maint-form-overlay';
    overlay.innerHTML = `<div class="maint-form">
      <button class="cp-close" style="position:absolute;top:10px;right:14px">&times;</button>
      <h4>📝 Maintenance Record</h4>
      <div class="maint-form-info">
        <strong>${(crawlerData.name || crawlerData.id || '—').replace(/</g,'&lt;')}</strong>
        ${crawlerData.country ? ' / ' + crawlerData.country : ''}
      </div>
      <label>Date</label>
      <input type="date" id="maintDate" value="${today}">
      <label>Action</label>
      <select id="maintAction">
        <option value="再起動">Restart</option>
        <option value="設定変更">Config Change</option>
        <option value="URL更新">URL Update</option>
        <option value="エラー調査">Error Investigation</option>
        <option value="新規作成">New Creation</option>
        <option value="その他">Other</option>
      </select>
      <label>Result</label>
      <select id="maintResult">
        <option value="復旧">Resolved</option>
        <option value="未解決">Unresolved</option>
        <option value="経過観察">Monitoring</option>
        <option value="廃止">Retired</option>
      </select>
      <label>Notes (optional)</label>
      <textarea id="maintNotes" placeholder="Enter details or notes..."></textarea>
      <div class="maint-form-actions">
        <button class="btn-cancel" id="maintCancel">Cancel</button>
        <button class="btn-save" id="maintSave">Save</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);

    overlay.querySelector('.cp-close').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#maintCancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

    overlay.querySelector('#maintSave').addEventListener('click', async () => {
      const btn = overlay.querySelector('#maintSave');
      btn.disabled = true; btn.textContent = 'Saving...';
      const record = {
        crawlerId: crawlerData.id || '',
        crawlerName: crawlerData.name || '',
        country: crawlerData.country || '',
        date: overlay.querySelector('#maintDate').value,
        action: overlay.querySelector('#maintAction').value,
        result: overlay.querySelector('#maintResult').value,
        notes: overlay.querySelector('#maintNotes').value.trim(),
        createdAt: Date.now(),
        createdBy: userId || 'unknown',
        createdByName: userName || ''
      };
      try {
        await apiPost('/api/maintenance', record);
        overlay.remove();
        if (onSaved) onSaved();
      } catch(e) {
        console.error('Save error:', e);
        alert('Failed to save: ' + (e.message || ''));
        btn.disabled = false; btn.textContent = 'Save';
      }
    });
  }

  function showEditForm(logDoc, onSaved) {
    const existing = document.querySelector('.maint-form-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'maint-form-overlay';
    const actions = ['再起動','設定変更','URL更新','エラー調査','新規作成','自動検知','その他'];
    const results = ['復旧','未解決','経過観察','ローカル実行','廃止'];
    overlay.innerHTML = `<div class="maint-form">
      <button class="cp-close" style="position:absolute;top:10px;right:14px">&times;</button>
      <h4>✏️ Edit Record</h4>
      <div class="maint-form-info">
        <strong>${(logDoc.crawlerName || logDoc.crawlerId || '—').replace(/</g,'&lt;')}</strong>
        ${logDoc.country ? ' / ' + logDoc.country : ''}
      </div>
      <label>Date</label>
      <input type="date" id="maintDate" value="${logDoc.date || ''}">
      <label>Action</label>
      <select id="maintAction">
        ${actions.map(a => '<option value="'+a+'"'+(logDoc.action===a?' selected':'')+'>'+actionLabels[a]+'</option>').join('')}
      </select>
      <label>Result</label>
      <select id="maintResult">
        ${results.map(r => '<option value="'+r+'"'+(logDoc.result===r?' selected':'')+'>'+resultLabels[r]+'</option>').join('')}
      </select>
      <div id="editLocalOnlyHint" style="display:${logDoc.result === 'ローカル実行' ? 'block' : 'none'};margin-top:8px;padding:10px 12px;background:#DBEAFE;border:2px solid #1E40AF;border-radius:6px;font-size:12px;line-height:1.6;color:#1E40AF">
        <strong>📋 Local Only procedure:</strong><br>
        1. Move the crawler to <strong>osintech04</strong><br>
        2. Add to <strong>Production_with_Proxy</strong> group
      </div>
      <label>Notes (optional)</label>
      <textarea id="maintNotes">${(logDoc.notes || '').replace(/</g,'&lt;')}</textarea>
      <div class="maint-form-actions">
        <button class="btn-cancel" id="maintCancel">Cancel</button>
        <button class="btn-save" id="maintSave">Update</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const editResultSel = overlay.querySelector('#maintResult');
    const editLocalHint = overlay.querySelector('#editLocalOnlyHint');
    editResultSel.addEventListener('change', () => {
      editLocalHint.style.display = editResultSel.value === 'ローカル実行' ? 'block' : 'none';
    });
    overlay.querySelector('.cp-close').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#maintCancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('#maintSave').addEventListener('click', async () => {
      const btn = overlay.querySelector('#maintSave');
      btn.disabled = true; btn.textContent = 'Updating...';
      try {
        await apiPut('/api/maintenance/' + logDoc.id, {
          date: overlay.querySelector('#maintDate').value,
          action: overlay.querySelector('#maintAction').value,
          result: overlay.querySelector('#maintResult').value,
          notes: overlay.querySelector('#maintNotes').value.trim()
        });
        overlay.remove();
        if (onSaved) onSaved();
      } catch(e) {
        console.error('Update error:', e);
        alert('Failed to update: ' + (e.message || ''));
        btn.disabled = false; btn.textContent = 'Update';
      }
    });
  }

  async function loadCountryHistory(country, detailOverlay) {
    const container = detailOverlay.querySelector('#detailMaintHistory');
    if (!container) return;
    container.innerHTML = '<h5>📋 Maintenance History</h5><p class="maint-history-empty">Loading...</p>';
    try {
      const docs = await apiGet('/api/maintenance?country=' + encodeURIComponent(country) + '&limit=30');
      if (docs.length === 0) {
        container.innerHTML = '<h5>📋 Maintenance History</h5><p class="maint-history-empty">No records for this country yet</p>';
        return;
      }
      let html = '<h5>📋 Maintenance History (' + docs.length + ' records)</h5>';
      docs.forEach(log => {
        // Normalize snake_case from Postgres to camelCase
        const crawlerName = log.crawler_name || log.crawlerName || '';
        const crawlerId = log.crawler_id || log.crawlerId || '';
        const autoRecovery = log.auto_recovery || log.autoRecovery || false;
        const createdByName = log.created_by_name || log.createdByName || '';
        const createdAt = log.created_at || log.createdAt;
        const updatedAt = log.updated_at || log.updatedAt;
        const resultClass = log.result === '復旧' ? 'resolved' : log.result === '未解決' ? 'unresolved' : log.result === '経過観察' ? 'monitoring' : log.result === 'ローカル実行' ? 'local-only' : 'retired';
        html += `<div class="maint-log-item" style="cursor:pointer" data-logid="${log.id}" title="Click to edit">
          <span class="maint-date">${log.date || '—'}</span>
          <span class="maint-action-badge">${actionLabels[log.action] || log.action || '—'}</span>
          <span class="maint-result-badge ${resultClass}">${resultLabels[log.result] || log.result || '—'}</span>
          <strong style="font-size:11px;margin-left:6px">${(crawlerName || crawlerId || '').replace(/</g,'&lt;')}</strong>
          ${autoRecovery ? '<span style="font-size:10px;color:#065F46;margin-left:4px">🤖Auto</span>' : ''}
          ${log.notes ? '<div class="maint-notes">' + log.notes.replace(/</g,'&lt;') + '</div>' : ''}
          <div class="maint-user">
            ${createdByName || '—'} · ${createdAt ? new Date(createdAt).toLocaleString('en-US') : ''}
            ${updatedAt ? ' (edited: ' + new Date(updatedAt).toLocaleString('en-US') + ')' : ''}
            <button class="maint-delete-btn" data-id="${log.id}" title="Delete" style="margin-left:8px">×</button>
          </div>
        </div>`;
      });
      container.innerHTML = html;

      // Bind edit (click on card) and delete
      container.querySelectorAll('.maint-log-item').forEach(card => {
        const logId = card.dataset.logid;
        const logData = docs.find(d => String(d.id) === String(logId));
        if (!logData) return;
        // Normalize for showEditForm
        logData.crawlerName = logData.crawler_name || logData.crawlerName || '';
        logData.crawlerId = logData.crawler_id || logData.crawlerId || '';
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('maint-delete-btn')) return;
          showEditForm(logData, () => loadCountryHistory(country, detailOverlay));
        });
      });
      container.querySelectorAll('.maint-delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Delete this record?')) return;
          try {
            await apiDelete('/api/maintenance/' + btn.dataset.id);
            loadCountryHistory(country, detailOverlay);
          } catch(err) { alert('Failed to delete'); }
        });
      });
    } catch(e) {
      console.error('Load country history error:', e);
      container.innerHTML = '<h5>📋 Maintenance History</h5><p class="maint-history-empty">Loading error</p>';
    }
  }

  // Auto-recovery: when CSV is loaded, check 経過観察 crawlers whose errors are now cleared
  async function checkAutoRecovery() {
    if (!rawRows || !colMap.stopDays) return;
    try {
      // Fetch all 経過観察 records via API
      const allLogs = await apiGet('/api/maintenance?limit=200');
      const monitoringLogs = allLogs.filter(l => l.result === '経過観察');
      if (monitoringLogs.length === 0) return;

      // Build map of latest 経過観察 record per crawlerId/crawlerName
      const monitoring = new Map();
      monitoringLogs.forEach(d => {
        const key = d.crawler_id || d.crawlerId || d.crawler_name || d.crawlerName;
        if (key && !monitoring.has(key)) monitoring.set(key, d);
      });
      if (monitoring.size === 0) return;

      const crawlerIdCol = headers.find(h => h.toLowerCase().includes('crawler id')) || '';
      const nameCol = headers.find(h => h.toLowerCase().includes('organization') && h.toLowerCase().includes('original')) || '';
      const today = new Date().toISOString().slice(0, 10);
      let recoveredCount = 0;

      for (const [key, logData] of monitoring) {
        const matchRow = rawRows.find(r => {
          const cid = crawlerIdCol ? (r[crawlerIdCol] || '').trim() : '';
          const name = nameCol ? (r[nameCol] || '').trim() : '';
          return (cid && cid === key) || (name && name === key);
        });
        if (!matchRow) continue;
        const stopDays = parseInt(matchRow[colMap.stopDays]);
        if (isNaN(stopDays) || stopDays > 0) continue; // still stopped

        // Crawler was 経過観察 and is now active → auto-record 復旧
        try {
          await apiPost('/api/maintenance', {
            crawlerId: logData.crawler_id || logData.crawlerId || '',
            crawlerName: logData.crawler_name || logData.crawlerName || '',
            country: logData.country || '',
            date: today,
            action: '自動検知',
            result: '復旧',
            notes: 'Crawler under monitoring confirmed active on CSV update. Auto-recovery record created.',
            autoRecovery: true,
            originalLogId: logData.id
          });
          recoveredCount++;
        } catch(e) { console.error('Auto-recovery save error for', key, e); }
      }

      if (recoveredCount > 0) {
        const notif = document.createElement('div');
        notif.style.cssText = 'position:fixed;top:20px;right:20px;background:#DEF7EC;border:3px solid #065F46;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;color:#065F46;z-index:10002;box-shadow:4px 4px 0 #065F46;transition:opacity .5s';
        notif.textContent = '✅ ' + recoveredCount + ' crawler(s) recovered (auto-detected)';
        document.body.appendChild(notif);
        setTimeout(() => { notif.style.opacity = '0'; setTimeout(() => notif.remove(), 600); }, 4000);
      }
    } catch(e) { console.error('Auto-recovery check error:', e); }
  }

  async function renderMaintPanel() {
    const panel = document.getElementById('tabMaint');
    if (!panel) return;

    panel.innerHTML = '<div class="maint-panel"><h3>📋 All Maintenance History</h3><div class="maint-panel-loading">Loading...</div></div>';

    if (!dbReady) {
      panel.innerHTML = '<div class="maint-panel"><h3>📋 All Maintenance History</h3><div class="maint-panel-empty">Cannot connect to database.</div></div>';
      return;
    }

    try {
      const rawDocs = await apiGet('/api/maintenance?limit=50');
      const docs = (rawDocs || []).map(log => ({
        ...log,
        crawlerName: log.crawler_name || log.crawlerName || '',
        crawlerId: log.crawler_id || log.crawlerId || '',
        createdByName: log.created_by_name || log.createdByName || '',
        autoRecovery: log.auto_recovery || log.autoRecovery || false,
      }));

      if (docs.length === 0) {
        panel.innerHTML = '<div class="maint-panel"><h3>📋 All Maintenance History</h3><div class="maint-panel-empty">No records yet</div></div>';
        return;
      }

      let tableHTML = `<div class="maint-panel"><h3>📋 All Maintenance History (${docs.length} records)</h3>
        <div style="overflow-x:auto"><table class="maint-panel-table">
        <thead><tr><th>Date</th><th>Crawler</th><th>Country</th><th>Action</th><th>Result</th><th>Notes</th><th>By</th><th></th></tr></thead><tbody>`;

      docs.forEach(log => {
        const resultClass = log.result === '復旧' ? 'resolved' :
          log.result === '未解決' ? 'unresolved' :
          log.result === '経過観察' ? 'monitoring' :
          log.result === 'ローカル実行' ? 'local-only' : 'retired';
        tableHTML += `<tr class="maint-panel-row" data-logid="${log.id}" style="cursor:pointer" title="Click to edit">
          <td style="white-space:nowrap;font-family:var(--mono);font-size:11px">${log.date || '—'}</td>
          <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(log.crawlerName||'').replace(/"/g,'&quot;')}">${log.crawlerName || log.crawlerId || '—'}${log.autoRecovery ? ' 🤖' : ''}</td>
          <td>${log.country || '—'}</td>
          <td><span class="maint-action-badge">${actionLabels[log.action] || log.action || '—'}</span></td>
          <td><span class="maint-result-badge ${resultClass}">${resultLabels[log.result] || log.result || '—'}</span></td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(log.notes||'').replace(/"/g,'&quot;')}">${log.notes ? log.notes.replace(/</g,'&lt;') : '—'}</td>
          <td style="font-size:11px">${log.createdByName || '—'}</td>
          <td><button class="maint-delete-btn" data-id="${log.id}" title="Delete">×</button></td>
        </tr>`;
      });

      tableHTML += '</tbody></table></div></div>';
      panel.innerHTML = tableHTML;

      // Bind edit (click on row) and delete
      panel.querySelectorAll('.maint-panel-row').forEach(row => {
        const logId = row.dataset.logid;
        const logData = docs.find(d => d.id === logId);
        if (!logData) return;
        row.addEventListener('click', (e) => {
          if (e.target.classList.contains('maint-delete-btn')) return;
          showEditForm(logData, () => { renderMaintPanel(); });
        });
      });
      panel.querySelectorAll('.maint-delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const docId = btn.dataset.id;
          if (!confirm('Delete this record?')) return;
          try {
            await apiDelete('/api/maintenance/' + docId);
            renderMaintPanel();
          } catch(err) {
            alert('Failed to delete');
          }
        });
      });
    } catch(e) {
      console.error('Load all logs error:', e);
      panel.innerHTML = '<div class="maint-panel"><h3>📋 All Maintenance History</h3><div class="maint-panel-empty">Loading error</div></div>';
    }
  }

  render();

  // Auto-recovery check after db initializes
  setTimeout(() => { checkAutoRecovery(); }, 3000);
}
</script>
</body>
</html>
