<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crawler Status Heatmap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #F5F0E8;
  --surface: #FFFFFF;
  --border: #222222;
  --border-w: 3px;
  --shadow: 5px 5px 0 #222;
  --shadow-sm: 3px 3px 0 #222;
  --text: #222222;
  --text-muted: #555555;
  --text-dim: #999999;
  --green: #22C55E;
  --green-bg: #BBFAD0;
  --red: #EF4444;
  --red-bg: #FDCECE;
  --amber: #F59E0B;
  --amber-bg: #FDE68A;
  --blue: #3B82F6;
  --blue-bg: #BFDBFE;
  --pink: #EC4899;
  --pink-bg: #FBCFE8;
  --purple: #8B5CF6;
  --purple-bg: #DDD6FE;
  --yellow: #FACC15;
  --yellow-bg: #FEF9C3;
  --font: 'Space Grotesk', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 0px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.5;
}

.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 24px;
}

header {
  margin-bottom: 32px;
}

header h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

header p {
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 500;
}

.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}

.stat-card .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 2px;
  font-weight: 700;
}

.stat-card .value {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 700;
}

.stat-card .value.green { color: #16A34A; }
.stat-card .value.red { color: var(--red); }
.stat-card .value.amber { color: #D97706; }

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}

.controls .group-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  margin-right: 2px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.pill-group {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.pill {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: all .1s;
  white-space: nowrap;
  box-shadow: 2px 2px 0 #222;
}

.pill:hover {
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 #222;
}

.pill:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

.pill.active {
  background: var(--yellow);
  color: var(--text);
  border-color: var(--border);
}

.separator {
  width: 3px;
  height: 24px;
  background: var(--border);
  margin: 0 6px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  margin-left: auto;
  box-shadow: 2px 2px 0 #222;
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 0;
  width: 160px;
}

.search-box input::placeholder { color: var(--text-dim); }

.search-box svg { flex-shrink: 0; }

.grid-container {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}

.grid-container.cartogram-mode {
  display: grid;
  grid-template-columns: repeat(30, 1fr);
  grid-template-rows: repeat(30, 1fr);
  gap: 3px;
  width: 100%;
  aspect-ratio: 30 / 15;
  position: relative;
}
.region-outline {
  border: 2px dashed;
  border-radius: 6px;
  pointer-events: none;
  z-index: 1;
  opacity: 0.55;
  position: relative;
  margin: -2px;
}
.region-label {
  position: absolute;
  top: -11px;
  left: 4px;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  pointer-events: none;
  z-index: 5;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  background: rgba(255,253,247,.85);
}

.grid-container.cartogram-mode .cell {
  min-width: 0;
  padding: 2px 2px;
  grid-column: var(--gc);
  grid-row: var(--gr);
  border-width: 2px;
  box-shadow: 2px 2px 0 #222;
}

.grid-container.cartogram-mode .cell .name {
  font-size: 9px;
  max-width: none;
}

.grid-container.cartogram-mode .cell .num {
  font-size: 8px;
}
.cell.cell-empty {
  background: #e5e5e5 !important;
  color: #999 !important;
  border-color: #ccc !important;
  box-shadow: 1px 1px 0 #bbb !important;
  opacity: 0.7;
}
.cell.cell-empty .name {
  color: #888 !important;
}
.cell.cell-empty .num {
  color: #aaa !important;
}

.cell {
  border-radius: var(--radius);
  padding: 6px 7px;
  min-width: 64px;
  text-align: center;
  cursor: default;
  position: relative;
  transition: transform .1s, box-shadow .1s;
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-sm);
}

.cell:hover {
  transform: translate(-2px, -2px);
  z-index: 10;
  box-shadow: 6px 6px 0 #222;
}

.cell .name {
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
  max-width: 72px;
  color: #222 !important;
}

.cell .num {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  opacity: .85;
}

.tooltip {
  display: none;
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  white-space: nowrap;
  z-index: 100;
  pointer-events: none;
  box-shadow: var(--shadow);
  text-align: left;
  color: var(--text);
}

.tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--border);
}

.cell:hover .tooltip { display: block; }

.tooltip .tt-name {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 6px;
  color: var(--text);
}

.tooltip .tt-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 1px 0;
}

.tooltip .tt-label { color: var(--text-muted); font-weight: 500; }
.tooltip .tt-val { font-family: var(--mono); font-weight: 700; }
.tooltip .tt-val.g { color: #16A34A; }
.tooltip .tt-val.r { color: var(--red); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }

.column-mapper {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.column-mapper h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.mapper-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}

.mapper-field label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text);
  margin-bottom: 4px;
  font-weight: 700;
}

.mapper-field select {
  width: 100%;
  padding: 7px 10px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  box-shadow: 2px 2px 0 #222;
}

.mapper-field select:focus {
  background: var(--yellow-bg);
}

.mapper-field .auto-detected {
  font-size: 10px;
  color: #16A34A;
  margin-top: 2px;
  font-weight: 700;
  text-transform: uppercase;
}

.apply-btn {
  margin-top: 14px;
  padding: 10px 24px;
  background: var(--yellow);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .1s;
  box-shadow: var(--shadow-sm);
  text-transform: uppercase;
}

.apply-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 #222;
}

.apply-btn:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}

.file-info {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--blue-bg);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.file-info .filename {
  font-family: var(--mono);
  font-weight: 700;
  color: var(--text);
}

.file-info .meta {
  color: var(--text-muted);
}

.file-info .reset-btn {
  margin-left: auto;
  padding: 5px 14px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .1s;
  box-shadow: 2px 2px 0 #222;
}

.file-info .reset-btn:hover {
  background: var(--red-bg);
}

.org-filter-section {
  display: flex;
  align-items: center;
  gap: 5px;
}

.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 16px;
  overflow-y: auto;
}

.detail-panel {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 900px;
  max-height: calc(100vh - 96px);
  overflow-y: auto;
  padding: 24px;
  box-shadow: 8px 8px 0 #222;
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.detail-header h2 {
  font-size: 22px;
  font-weight: 700;
  text-transform: uppercase;
}

.detail-header .detail-summary {
  display: flex;
  gap: 12px;
  font-size: 14px;
  font-weight: 700;
}

.detail-header .detail-summary span {
  font-family: var(--mono);
}

.detail-close {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 20px;
  width: 36px;
  height: 36px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .1s;
  flex-shrink: 0;
  margin-left: 16px;
  box-shadow: 2px 2px 0 #222;
  font-weight: 700;
}

.detail-close:hover {
  background: var(--red-bg);
}

.detail-close:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

.detail-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.detail-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text);
  padding: 10px 10px;
  border-bottom: var(--border-w) solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--surface);
  font-weight: 700;
}

.detail-table td {
  padding: 8px 10px;
  border-bottom: 2px solid var(--bg);
  vertical-align: top;
}

.detail-table tr:hover td {
  background: var(--yellow-bg);
}

.detail-table .org-name {
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.detail-table .org-name a {
  color: var(--blue);
  text-decoration: none;
  font-weight: 600;
  border-bottom: 2px solid var(--blue);
}

.detail-table .org-name a:hover {
  background: var(--blue-bg);
}

.badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: var(--radius);
  font-weight: 700;
  border: 2px solid var(--border);
  text-transform: uppercase;
}

.badge-active {
  background: var(--green-bg);
  color: #15803D;
}

.badge-stopped {
  background: var(--red-bg);
  color: #B91C1C;
}

.stop-days {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
}

.tab-bar {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.tab-bar button {
  flex: 1;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  padding: 12px 16px;
  border: none;
  border-right: var(--border-w) solid var(--border);
  cursor: pointer;
  transition: all .1s;
  text-transform: uppercase;
  background: var(--surface);
  color: var(--text-muted);
}

.tab-bar button:last-child { border-right: none; }

.tab-bar button:hover {
  background: var(--yellow-bg);
}

.tab-bar button.tab-active {
  background: var(--border);
  color: #fff;
}

.tab-bar button.tab-active[data-tab="action"] {
  background: var(--red);
}

.tab-bar button.tab-active[data-tab="maint"] {
  background: var(--blue);
}

.action-panel {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.search-results-panel {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.search-results-panel h3 {
  margin: 0 0 12px 0;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-results-panel .sr-count {
  font-weight: 400;
  color: #666;
  font-size: 13px;
}
.search-results-panel table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.search-results-panel th {
  text-align: left;
  padding: 8px 6px;
  border-bottom: 2px solid var(--border);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.search-results-panel td {
  padding: 7px 6px;
  border-bottom: 1px solid #e5e5e5;
  vertical-align: middle;
}
.search-results-panel tr:hover td {
  background: #f8f5ee;
}
.search-results-panel .sr-org {
  cursor: pointer;
  font-weight: 600;
  border-bottom: 2px dashed var(--border);
}
.search-results-panel .sr-org:hover {
  color: var(--accent);
}
.search-results-panel .sr-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.search-results-panel .sr-status.active {
  background: var(--green-bg);
  color: var(--green);
}
.search-results-panel .sr-status.stopped {
  background: var(--red-bg);
  color: #991B1B;
}

.action-panel h3 {
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.action-panel .action-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
  font-weight: 500;
}

.action-panel .action-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.action-panel .action-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text);
  padding: 10px 10px;
  border-bottom: var(--border-w) solid var(--border);
  white-space: nowrap;
  font-weight: 700;
  background: var(--surface);
}

.action-panel .action-table td {
  padding: 8px 10px;
  border-bottom: 2px solid var(--bg);
  vertical-align: top;
}

.action-panel .action-table tr:hover td {
  background: var(--yellow-bg);
}

.action-panel .action-table .rank-cell {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 14px;
  text-align: center;
  width: 40px;
}

.action-panel .prio-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  text-transform: uppercase;
  white-space: nowrap;
}

.action-panel .prio-badge.critical { background: var(--red-bg); color: #991B1B; }
.action-panel .prio-badge.important { background: var(--amber-bg); color: #92400E; }
.action-panel .prio-badge.normal { background: #E5E7EB; color: #374151; }

.crawler-popup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000;
}
.crawler-popup {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius);
  box-shadow: 8px 8px 0 #222;
  padding: 24px 28px;
  max-width: 520px; width: 90%;
  position: relative;
}
.crawler-popup h4 {
  font-size: 15px; font-weight: 700; text-transform: uppercase;
  margin: 0 0 16px; letter-spacing: .5px;
}
.crawler-popup .cp-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: var(--text); font-weight: 700; line-height: 1;
}
.crawler-popup .cp-row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 0; border-bottom: 2px solid var(--bg);
  font-size: 13px;
}
.crawler-popup .cp-row:last-child { border-bottom: none; }
.crawler-popup .cp-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
  font-weight: 700; color: var(--text-muted); min-width: 100px; flex-shrink: 0;
}
.crawler-popup .cp-val {
  word-break: break-all; flex: 1;
}
.crawler-popup .cp-copyable {
  cursor: pointer; border-bottom: 2px dashed var(--border);
  padding-bottom: 1px; font-family: var(--mono); font-size: 13px;
  transition: color .15s;
}
.crawler-popup .cp-copyable:hover { color: var(--blue); }
.crawler-popup .cp-link {
  color: var(--blue); text-decoration: underline; word-break: break-all; font-size: 13px;
}

/* Maintenance record UI */
.maint-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--blue); color: #fff; border: 3px solid var(--border);
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; margin-top: 12px; box-shadow: 2px 2px 0 var(--border);
  transition: transform .1s, box-shadow .1s;
}
.maint-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--border); }
.maint-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--border); }
.maint-btn.secondary {
  background: var(--bg); color: var(--border); font-size: 12px;
  padding: 6px 12px; margin-top: 8px;
}

.maint-history { margin-top: 14px; border-top: 2px dashed var(--border); padding-top: 10px; }
.maint-history h5 { font-size: 13px; font-weight: 800; margin: 0 0 8px; }
.maint-history-empty { font-size: 12px; color: #888; font-style: italic; }
.maint-log-item {

<body>
<div class="app" id="app">
  <header>
    <h1>Crawler status heatmap</h1>
    <p>Visualize crawler status by country as a heatmap</p>
  </header>

  <div id="loadingMsg" style="text-align:center;padding:60px 20px;font-size:16px;color:#666">
    <p>Loading crawler data...</p>
  </div>

  <div id="mapperSection" style="display:none"></div>
  <div id="fileInfoSection" style="display:none"></div>
  <div id="dashboard" style="display:none"></div>
</div>

<script>
const COLORS = [
  { max: 0,   bg: '#BBFAD0', text: '#15803D', label: '0%' },
  { max: 15,  bg: '#86EFAC', text: '#14532D', label: '~15%' },
  { max: 25,  bg: '#BEF264', text: '#365314', label: '~25%' },
  { max: 35,  bg: '#FDE68A', text: '#713F12', label: '~35%' },
  { max: 50,  bg: '#FDBA74', text: '#7C2D12', label: '~50%' },
  { max: 65,  bg: '#FCA5A5', text: '#7F1D1D', label: '~65%' },
  { max: 80,  bg: '#FDA4AF', text: '#881337', label: '~80%' },
  { max: 100, bg: '#FCA5A5', text: '#991B1B', label: '100%' },
];

function getColorForPct(pct) {
  for (const c of COLORS) {
    if (pct <= c.max) return c;
  }
  return COLORS[COLORS.length - 1];
}

let rawRows = [];
let headers = [];
let colMap = { country: '', orgType: '', stopDays: '', status: '', octoAccount: '', priority: '' };
let fileName = '';

// Load CSV data from server
async function loadCSVData() {
  const loadingMsg = document.getElementById('loadingMsg');
  try {
    const resp = await fetch('/api/csv-data');
    if (!resp.ok) throw new Error('Failed to fetch');
    const json = await resp.json();
    if (!json.data || !json.data.csv_content) throw new Error('No data');

    const saved = json.data;
    let text = saved.csv_content;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    _lastCsvText = text;
    const lines = parseCSV(text);
    if (lines.length < 2) throw new Error('Empty CSV');

    headers = lines[0].map(h => h.trim());
    rawRows = lines.slice(1).map(l => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (l[i] || '').trim());
      return obj;
    });
    fileName = saved.file_name || 'Crawler Data';

    if (saved.col_map && typeof saved.col_map === 'object' && saved.col_map.country) {
      colMap = saved.col_map;
    } else {
      autoDetectColumns();
    }

    if (loadingMsg) loadingMsg.style.display = 'none';

    if (colMap.country && colMap.stopDays) {
      buildDashboard();
    } else {
      autoDetectColumns();
      showMapper();
    }
  } catch (e) {
    console.log('No saved CSV data:', e.message);
    if (loadingMsg) {
      loadingMsg.innerHTML = '<p style="color:var(--red);font-weight:600">No crawler data found.</p><p style="font-size:14px;margin-top:8px">Upload CSV data via the API first.</p>';
    }
  }
}

// Auto-load on page load
loadCSVData();

function parseCSV(text) {
  const rows = [];
  let current = '';
  let inQuotes = false;
  const lines = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i+1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if ((ch === ',' ) && !inQuotes) {
      rows.push(current); current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      rows.push(current); current = '';
      lines.push([...rows]); rows.length = 0;
    } else {
      current += ch;
    }
  }
  if (current || rows.length) { rows.push(current); lines.push([...rows]); }
  return lines.filter(l => l.some(c => c.trim()));
}

let _lastCsvText = '';
function handleFile(file) {
  fileName = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    let text = e.target.result;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    _lastCsvText = text;
    const lines = parseCSV(text);
    if (lines.length < 2) return;
    headers = lines[0].map(h => h.trim());
    rawRows = lines.slice(1).map(l => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (l[i] || '').trim());
      return obj;
    });
    autoDetectColumns();
    showMapper();
  };
  reader.readAsText(file, 'UTF-8');
}

function saveCSVToServer() {
  if (!_lastCsvText) return;
  fetch('/api/csv-data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fileName, csvContent: _lastCsvText, colMap })
  }).catch(e => console.error('Failed to save CSV:', e));
}

function autoDetectColumns() {
  const lower = headers.map(h => h.toLowerCase());
  colMap.country = headers[lower.findIndex(h => h === 'country')] || '';
  colMap.orgType = headers[lower.findIndex(h => h.includes('type') && h.includes('org'))] || '';
  colMap.stopDays = headers[lower.findIndex(h => h.includes('停止日数') || h === 'stop days' || h === 'stopdays')] || '';
  colMap.status = headers[lower.findIndex(h => h === 'status')] || '';
  colMap.octoAccount = headers[lower.findIndex(h => h.includes('octoparse') && h.includes('account'))] || '';
  colMap.priority = headers[lower.findIndex(h => h === '優先度' || h === 'priority')] || '';
}

function showMapper() {
  const loadingMsg = document.getElementById('loadingMsg');
  if (loadingMsg) loadingMsg.style.display = 'none';
  const sec = document.getElementById('mapperSection');
  sec.style.display = 'block';
  const opts = h => headers.map(col => `<option value="${col}" ${col === h ? 'selected' : ''}>${col}</option>`).join('');
  sec.innerHTML = `
    <div class="column-mapper">
      <h3>Column Mapping</h3>
      <div class="mapper-grid">
        <div class="mapper-field">
          <label>Country</label>
          <select id="selCountry"><option value="">-- Select --</option>${opts(colMap.country)}</select>
          ${colMap.country ? '<div class="auto-detected">✓ auto-detected</div>' : ''}
        </div>
        <div class="mapper-field">
          <label>Type of Organization</label>
          <select id="selOrgType"><option value="">-- Select (optional) --</option>${opts(colMap.orgType)}</select>
          ${colMap.orgType ? '<div class="auto-detected">✓ auto-detected</div>' : ''}
        </div>
        <div class="mapper-field">
          <label>Stop Days</label>
          <select id="selStopDays"><option value="">-- Select --</option>${opts(colMap.stopDays)}</select>
          ${colMap.stopDays ? '<div class="auto-detected">✓ auto-detected</div>' : ''}
        </div>
        <div class="mapper-field">
          <label>Status (optional)</label>
          <select id="selStatus"><option value="">-- Select (optional) --</option>${opts(colMap.status)}</select>
          ${colMap.status ? '<div class="auto-detected">✓ auto-detected</div>' : ''}
        </div>
        <div class="mapper-field">
          <label>Octoparse Account (optional)</label>
          <select id="selOctoAccount"><option value="">-- Select (optional) --</option>${opts(colMap.octoAccount)}</select>
          ${colMap.octoAccount ? '<div class="auto-detected">✓ auto-detected</div>' : ''}
        </div>
        <div class="mapper-field">
          <label>Priority (optional)</label>
          <select id="selPriority"><option value="">-- Select (optional) --</option>${opts(colMap.priority)}</select>
          ${colMap.priority ? '<div class="auto-detected">✓ auto-detected</div>' : ''}
        </div>
      </div>
      <button class="apply-btn" id="applyBtn">Apply & Show Heatmap</button>
    </div>
  `;
  document.getElementById('applyBtn').addEventListener('click', () => {
    colMap.country = document.getElementById('selCountry').value;
    colMap.orgType = document.getElementById('selOrgType').value;
    colMap.stopDays = document.getElementById('selStopDays').value;
    colMap.status = document.getElementById('selStatus').value;
    colMap.octoAccount = document.getElementById('selOctoAccount').value;
    colMap.priority = document.getElementById('selPriority').value;
    if (!colMap.country || !colMap.stopDays) {
      alert('Country and Stop Days are required');
      return;
    }
    sec.style.display = 'none';
    saveCSVToServer();
    buildDashboard();
  });
}

function buildDashboard() {
  const fileInfoSec = document.getElementById('fileInfoSection');
  fileInfoSec.style.display = 'block';
  fileInfoSec.innerHTML = `
    <div class="file-info">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="filename">${fileName}</span>
      <span class="meta">${rawRows.length} rows</span>
      <button class="reset-btn" id="updateBtn" title="Upload new CSV data">🔄 Update Data</button>
      <input type="file" id="csvFileInput" accept=".csv" style="display:none">
    </div>
  `;
  document.getElementById('updateBtn').addEventListener('click', () => {
    document.getElementById('csvFileInput').click();
  });
  document.getElementById('csvFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const btn = document.getElementById('updateBtn');
    btn.disabled = true; btn.textContent = '⏳ Uploading...';
    try {
      const text = await file.text();
      const resp = await fetch('/api/csv-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName: file.name, csvContent: text, colMap: colMap })
      });
      if (!resp.ok) throw new Error('Upload failed');
      fileInfoSec.style.display = 'none';
      document.getElementById('dashboard').style.display = 'none';
      await loadCSVData();
    } catch (err) {
      alert('CSV upload failed: ' + err.message);
      btn.disabled = false; btn.textContent = '🔄 Update Data';
    }
    e.target.value = '';
  });

  const orgTypes = new Set();
  if (colMap.orgType) {
    rawRows.forEach(r => {
      const v = (r[colMap.orgType] || '').trim();
      if (v) orgTypes.add(v);
    });
  }

  const statusTypes = new Set();
  if (colMap.status) {
    rawRows.forEach(r => {
      const v = (r[colMap.status] || '').trim();
      if (v) statusTypes.add(v);
    });
  }

  const octoAccounts = new Set();
  if (colMap.octoAccount) {
    rawRows.forEach(r => {
      const v = (r[colMap.octoAccount] || '').trim();
      if (v) v.split(';').forEach(a => { const t = a.trim(); if (t) octoAccounts.add(t); });
      else octoAccounts.add('(empty)');
    });
  }

  const priorityTypes = new Set();
  if (colMap.priority) {
    rawRows.forEach(r => {
      const v = (r[colMap.priority] || '').trim();
      if (v) priorityTypes.add(v);
      else priorityTypes.add('(empty)');
    });
  }

  const dash = document.getElementById('dashboard');
  dash.style.display = 'block';
  dash.innerHTML = `
    <div class="stats-bar" id="statsBar"></div>
    <div class="tab-bar" id="tabBar">
      <button class="tab-active" data-tab="heatmap">🗺 Heatmap</button>
      <button data-tab="action">⚠ Action Required</button>
      <button data-tab="maint">📋 Maintenance Log</button>
    </div>
    <div id="tabHeatmap">
      <div class="controls" id="controls"></div>
      <div id="searchResultsPanel" style="display:none"></div>
      <div class="grid-container" id="grid"></div>
    </div>
    <div id="tabAction" style="display:none"></div>
    <div id="tabMaint" style="display:none"></div>
    <div id="detailOverlay" class="detail-overlay" style="display:none"></div>
  `;

  let activeOrgTypes = new Set(orgTypes);
  let activeStatusTypes = new Set(statusTypes);
  let activeOctoAccounts = new Set(octoAccounts);
  let activePriorityTypes = new Set(priorityTypes);
  let sortBy = 'total';
  let searchQuery = '';
  let orgLang = 'en';
  let viewMode = 'tiles';
  let activeTab = 'heatmap';

  // Tab switching
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-bar button').forEach(b => {
      b.classList.toggle('tab-active', b.dataset.tab === tab);
    });
    document.getElementById('tabHeatmap').style.display = tab === 'heatmap' ? '' : 'none';
    document.getElementById('tabAction').style.display = tab === 'action' ? '' : 'none';
    document.getElementById('tabMaint').style.display = tab === 'maint' ? '' : 'none';

    if (tab === 'action') renderActionPanel();
    if (tab === 'maint') renderMaintPanel();
  }
  document.querySelectorAll('.tab-bar button').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });

  // Shared copy helpers
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => copyFallback(text));
    }
    return copyFallback(text);
  }
  function copyFallback(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }
  function bindCopy(container) {
    container.querySelectorAll('.action-copy, .cp-copyable').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = el.dataset.copy;
        copyText(text).then(() => {
          const orig = el.textContent;
          el.textContent = '✓ Copied';
          el.style.color = 'var(--green)';
          setTimeout(() => { el.textContent = orig; el.style.color = ''; }, 1200);
        });
      });
    });
  }

  function showCrawlerPopup(data) {
    const overlay = document.createElement('div');
    overlay.className = 'crawler-popup-overlay';
    const today = new Date().toISOString().slice(0, 10);
    let html = `<div class="crawler-popup" style="max-height:90vh;overflow-y:auto">
      <button class="cp-close">&times;</button>
      <h4>🦜 Crawler Details</h4>
      <div class="cp-row"><span class="cp-label">Organization</span><span class="cp-val" style="font-weight:600">${data.name || '—'}</span></div>
      <div class="cp-row"><span class="cp-label">Crawler ID</span><span class="cp-val"><span class="cp-copyable" data-copy="${data.id || ''}" title="Click to copy">${data.id || '—'}</span></span></div>
      <div class="cp-row"><span class="cp-label">Country</span><span class="cp-val">${data.country || '—'}</span></div>`;
    if (data.prio) {
      html += `<div class="cp-row"><span class="cp-label">Priority</span><span class="cp-val">${data.prio === '最重要' ? '<span class="prio-badge critical">Critical</span>' : data.prio === '重要' ? '<span class="prio-badge important">Important</span>' : data.prio}</span></div>`;
    }
    html += `<div class="cp-row"><span class="cp-label">Stop Days</span><span class="cp-val" style="font-family:var(--mono);font-weight:700;color:${parseInt(data.stop) > 0 ? 'var(--red)' : '#16A34A'}">${data.stop} days</span></div>
      <div class="cp-row"><span class="cp-label">Last Crawled</span><span class="cp-val">${data.last ? `<span class="cp-copyable" data-copy="${data.last}" title="Click to copy">${data.last}</span>` : '—'}</span></div>`;
    if (data.url) {
      html += `<div class="cp-row"><span class="cp-label">int-slate URL</span><span class="cp-val"><a href="${data.url}" target="_blank" rel="noopener" class="cp-link">${data.url}</a></span></div>`;
    }
    if (data.target) {
      html += `<div class="cp-row"><span class="cp-label">Target URL</span><span class="cp-val"><a href="${data.target}" target="_blank" rel="noopener" class="cp-link">${data.target}</a></span></div>`;
    }
    html += `
      <div style="margin-top:18px;padding-top:16px;border-top:3px solid #1a1a1a">
        <h4 style="margin:0 0 12px;font-size:15px">📝 Record Maintenance</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Date</label>
            <input type="date" id="cpMaintDate" value="${today}" style="width:100%;padding:8px;border:2px solid #1a1a1a;border-radius:6px;font-family:inherit;font-size:13px;box-sizing:border-box">
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Action</label>
            <select id="cpMaintAction" style="width:100%;padding:8px;border:2px solid #1a1a1a;border-radius:6px;font-family:inherit;font-size:13px;box-sizing:border-box">
              <option value="再起動">Restart</option>
              <option value="設定変更">Config Change</option>
              <option value="URL更新">URL Update</option>
              <option value="エラー調査">Error Investigation</option>
              <option value="新規作成">New Creation</option>
              <option value="その他">Other</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Result</label>
            <select id="cpMaintResult" style="width:100%;padding:8px;border:2px solid #1a1a1a;border-radius:6px;font-family:inherit;font-size:13px;box-sizing:border-box">
              <option value="復旧">Resolved</option>
              <option value="未解決">Unresolved</option>
              <option value="経過観察">Monitoring</option>
              <option value="ローカル実行">Local Only</option>
              <option value="廃止">Retired</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">&nbsp;</label>
            <button id="cpMaintSave" style="width:100%;padding:8px;background:#1a1a1a;color:#fff;border:2px solid #1a1a1a;border-radius:6px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 #888;transition:all .1s;box-sizing:border-box">Save</button>
          </div>
        </div>
        <div id="cpLocalOnlyHint" style="display:none;margin-top:8px;padding:10px 12px;background:#DBEAFE;border:2px solid #1E40AF;border-radius:6px;font-size:12px;line-height:1.6;color:#1E40AF">
          <strong>📋 Local Only procedure:</strong><br>
          1. Move the crawler to <strong>osintech04</strong><br>
          2. Add to <strong>Production_with_Proxy</strong> group
        </div>

  function getActionList() {
    const prioOrder = { '最重要': 0, '重要': 1 };
    const nameCol = headers.find(h => h.toLowerCase().includes('organization') && h.toLowerCase().includes('original')) || '';
    const jpCol = headers.find(h => h === '日本語名称') || '';
    const abbrCol = headers.find(h => h.toLowerCase().includes('abbreviation')) || '';
    const urlCol = headers.find(h => h.toLowerCase().includes('detail page url')) || '';
    const targetCol = headers.find(h => h.toLowerCase().includes('target url')) || '';
    const crawlerIdCol = headers.find(h => h.toLowerCase().includes('crawler id')) || '';
    const crawlerNameCol = headers.find(h => h.toLowerCase() === 'crawler_name' || h.toLowerCase() === 'crawler name') || '';
    const lastCrawledCol = headers.find(h => h.toLowerCase().includes('last crawled') || h.toLowerCase().includes('last_crawled')) || '';

    const items = [];
    rawRows.forEach(r => {
      const country = (r[colMap.country] || '').trim();
      if (!country) return;
      const stop = parseInt(r[colMap.stopDays]);
      if (isNaN(stop) || stop <= 0) return;
      const prio = colMap.priority ? (r[colMap.priority] || '').trim() : '';
      if (prio !== '最重要' && prio !== '重要') return;
      // apply active filters
      if (colMap.orgType) {
        const ot = (r[colMap.orgType] || '').trim();
        if (ot && !activeOrgTypes.has(ot)) return;
      }
      if (colMap.status) {
        const st = (r[colMap.status] || '').trim();
        if (st && !activeStatusTypes.has(st)) return;
      }
      if (colMap.octoAccount) {
        const raw = (r[colMap.octoAccount] || '').trim();
        const accts = raw ? raw.split(';').map(a => a.trim()).filter(Boolean) : [];
        if (accts.length > 0 && !accts.some(a => activeOctoAccounts.has(a))) return;
        if (accts.length === 0 && !activeOctoAccounts.has('(empty)')) return;
      }
      if (colMap.priority) {
        const prKey = prio || '(empty)';
        if (!activePriorityTypes.has(prKey)) return;
      }
      const orgName = r[nameCol] || '';
      const abbr = r[abbrCol] || '';
      const jp = r[jpCol] || '';
      const detailUrl = r[urlCol] || '';
      const targetUrl = r[targetCol] || '';
      const crawlerId = crawlerIdCol ? (r[crawlerIdCol] || '').trim() : '';
      const crawlerName = crawlerNameCol ? (r[crawlerNameCol] || '').trim() : '';
      // search filter for action list
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const fields = [country, orgName, abbr, jp, crawlerId, crawlerName, detailUrl, targetUrl];
        if (!fields.some(f => f.toLowerCase().includes(q))) return;
      }
      const displayName = orgLang === 'ja' && jp ? jp : (orgName || abbr);
      const status = colMap.status ? (r[colMap.status] || '').trim() : '';
      const octo = colMap.octoAccount ? (r[colMap.octoAccount] || '').trim() : '';
      let lastCrawled = lastCrawledCol ? (r[lastCrawledCol] || '').trim() : '';
      // normalize to yyyy-mm-dd
      if (lastCrawled) {
        const d = new Date(lastCrawled);
        if (!isNaN(d.getTime())) lastCrawled = d.toISOString().slice(0, 10);
      }
      items.push({ country, stop, prio, displayName, crawlerName, detailUrl, targetUrl, status, octo, crawlerId, lastCrawled, prioRank: prioOrder[prio] ?? 99 });
    });
    items.sort((a, b) => {
      if (a.prioRank !== b.prioRank) return a.prioRank - b.prioRank;
      return b.stop - a.stop;
    });
    return items;
  }

      if (q) {
